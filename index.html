<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6E6E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prumo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Prumo · gestão de tempo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first, one view at a time through bottom tabs; sticky date header; the Kanban is a snap-scrolling row of columns that becomes a 4-column grid on wide screens. */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#18222D; --muted:#5B6877; --line:#DAE1E8;
  --accent:#0B6E6E; --accent-ink:#FFFFFF; --accent-soft:#D6EDEC;
  --a1:#B8470F; --a2:#2F55B5; --a3:#7B3FA6; --a4:#1E7A3C; --a5:#A1224F; --a6:#56636F;
  --q1:#C23B2E; --q2:#2D5FA8; --q3:#A8740A; --q4:#6B7785;
  --warn:#B3261E; --ok:#1E7A3C;
  --f-body:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10161B; --surface:#192027; --ink:#E7ECF1; --muted:#96A3B1; --line:#28323C;
    --accent:#4FC3BC; --accent-ink:#06211F; --accent-soft:#17393A;
    --a1:#F59E6A; --a2:#8FAAF0; --a3:#C9A0EA; --a4:#7FD39A; --a5:#F08AAE; --a6:#A9B4BE;
    --q1:#FF8A7E; --q2:#8FB4EE; --q3:#E8B84A; --q4:#A0ABB7;
    --warn:#FF8A7E; --ok:#7FD39A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161B; --surface:#192027; --ink:#E7ECF1; --muted:#96A3B1; --line:#28323C;
  --accent:#4FC3BC; --accent-ink:#06211F; --accent-soft:#17393A;
  --a1:#F59E6A; --a2:#8FAAF0; --a3:#C9A0EA; --a4:#7FD39A; --a5:#F08AAE; --a6:#A9B4BE;
  --q1:#FF8A7E; --q2:#8FB4EE; --q3:#E8B84A; --q4:#A0ABB7;
  --warn:#FF8A7E; --ok:#7FD39A; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 160px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:14px 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.top .wd{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top h1{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.top .sum{font-size:12px;color:var(--muted);margin-top:4px}
.mini{font-family:var(--f-mono);font-size:13px;font-weight:600;padding:8px 12px;border-radius:999px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.mini.short,.mini.long{background:var(--a4);color:var(--surface)}
.mini.alert{animation:pulse 1s ease-in-out infinite}
.topr{display:flex;align-items:center;gap:8px}
.menu-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.menu-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.back{font-size:14px;font-weight:600;color:var(--accent);padding:8px 0;min-height:44px;margin-bottom:4px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px;min-height:64px}
.mrow b{display:block;font-size:16px}
.mrow span.d{display:block;font-size:13px;color:var(--muted);margin-top:2px}
@keyframes pulse{50%{opacity:.55}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h2{font-size:18px;margin-bottom:6px}
.panel p{color:var(--muted);max-width:60ch}

.pills{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.pill{flex:1 0 auto;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;white-space:nowrap;text-align:center;min-height:36px}
.pill .n{font-family:var(--f-mono);font-weight:500;color:var(--muted);margin-left:4px}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.on .n{color:inherit;opacity:.75}

.board{position:relative;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.col{flex:0 0 84%;max-width:360px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;min-width:0}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 2px 4px}
.col-h h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.col-h .count{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.col-h .count.full{color:var(--warn);font-weight:600}
.none{color:var(--muted);font-size:13px;padding:14px 2px}
.col-h h3 small{font-weight:500;text-transform:none;letter-spacing:0;font-size:11px;margin-left:4px}
.dayh{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:8px 2px 0}
.card.sm{padding:8px 10px;gap:4px}
.card.sm .card-title{font-size:14px;font-weight:600}
.card.sm .card-meta{gap:2px 10px}
.later{width:100%;text-align:center;padding:12px;border:1px dashed var(--line);border-radius:10px;color:var(--accent);font-weight:600;font-size:13px;min-height:44px;margin-top:6px}
@media (min-width:900px){
  .pills{display:none}
  .board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));overflow:visible}
  .col{flex:initial;max-width:none}
}

.card{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;min-width:0}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-title{font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.card-meta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:12px;color:var(--muted)}
.area{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink);min-width:0}
.area i{width:9px;height:9px;border-radius:50%;background:var(--ac);flex:none}
.q{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:1px 6px;border:1px solid currentColor;border-radius:5px}
.q1{color:var(--q1)}.q2{color:var(--q2)}.q3{color:var(--q3)}.q4{color:var(--q4)}
.dots{display:inline-flex;gap:3px}
.dots b{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.dots b.on{background:var(--accent);border-color:var(--accent)}
.late{color:var(--warn);font-weight:600}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.quad{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.quad-h{display:flex;flex-direction:column;gap:2px;padding-bottom:6px;border-bottom:2px solid currentColor}
.quad-h b{font-size:16px}
.quad-h span{font-size:12px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);width:100%;min-width:0}
.row:last-child{border-bottom:0}
.row .t{font-weight:500;overflow-wrap:anywhere;min-width:0}
.row .r{font-size:12px;color:var(--muted);white-space:nowrap}

.win{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.win.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.win-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.win-h .tm{font-family:var(--f-mono);font-size:17px;font-weight:600}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:2px 7px;border-radius:5px}
.cap{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.over i{background:var(--warn)}
.sect{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:18px 0 8px}
details.week{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}
details.week summary{cursor:pointer;font-weight:600}
.wk{display:flex;gap:10px;padding:6px 0;font-size:13px;flex-wrap:wrap}
.wk b{min-width:84px;text-transform:capitalize}

.focus{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:8px;text-align:center}
.ringbox{position:relative;width:min(72vw,260px);aspect-ratio:1}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbox circle{fill:none;stroke-width:9}
.ringbox .bg{stroke:var(--line)}
.ringbox .fg{stroke:var(--accent);stroke-linecap:round}
.ringbox.brk .fg{stroke:var(--a4)}
.ringbox .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.clock{font-family:var(--f-mono);font-size:46px;font-weight:600;letter-spacing:-.02em}
.phase{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.ftask{font-size:18px;font-weight:600;max-width:32ch;overflow-wrap:anywhere}
.cyc{display:flex;gap:6px}
.cyc b{width:12px;height:12px;border-radius:50%;border:2px solid var(--muted)}
.cyc b.on{background:var(--accent);border-color:var(--accent)}
.cyc b.cur{border-color:var(--accent)}
.ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}

.btn{min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.cand{width:100%;max-width:520px;text-align:left}

.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:25;width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;min-height:52px;text-align:center;border-radius:8px}
.tabs button.on{color:var(--accent)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#sheetwrap{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:rgba(10,16,22,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88dvh;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h2{font-size:20px;line-height:1.25;overflow-wrap:anywhere}
.sheet h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.x{width:40px;height:40px;font-size:26px;line-height:1;text-align:center;color:var(--muted)}
.sub{font-size:13px;color:var(--muted)}
.notes{font-size:14px;background:var(--bg);border-radius:8px;padding:10px 12px;overflow-wrap:anywhere}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 40%;min-height:44px;border:1px solid var(--line);border-radius:10px;text-align:center;font-weight:600;padding:0 10px}
.seg button[aria-pressed="true"],.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qname{font-size:13px;margin-top:8px;color:var(--muted)}
form label.l{display:block;font-size:13px;font-weight:600;margin:0 0 4px}
form input[type=time],form input[type=text],form input[type=number],form select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chk{position:relative}
.chk input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0}
.chk span{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;font-weight:600}
.chk input:checked + span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chk input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
form{display:flex;flex-direction:column;gap:14px}

.sheet label.l{display:block;font-size:13px;font-weight:600;margin:0 0 4px}
.sheet input[type=time],.sheet input[type=text],.sheet input[type=date]{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg)}
.btn.small{min-height:38px;padding:0 12px;font-size:13px}
.tag.warn{background:var(--warn);color:var(--surface)}
.row.wrapx{flex-wrap:wrap}
.acts{display:flex;gap:6px;flex-wrap:wrap}

details.kick{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
details.kick summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
details.kick .bar{margin:10px 0 4px}
details.kick ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.kitem{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.kitem:last-child{border-bottom:0}
.kitem>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kitem b{font-weight:600;overflow-wrap:anywhere}
.kitem.done b{color:var(--muted)}
.kh{font-size:13px;color:var(--muted)}
.kn{font-size:12px;color:var(--accent)}
.ck{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;margin-top:1px}
.kitem.done .ck{background:var(--accent);border-color:var(--accent)}
.ck svg{width:14px;height:14px;fill:none;stroke:var(--accent-ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

details.proj{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
details.proj summary{cursor:pointer;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.proj .pt{font-weight:600;flex:1 1 140px;min-width:0;overflow-wrap:anywhere}
details.proj .r{font-size:12px;color:var(--muted)}

details.plan{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
details.plan details.plan{background:var(--bg);margin:10px 0 0}
details.plan>summary{cursor:pointer;display:flex;flex-direction:column;gap:6px;list-style:none}
details.plan>summary::-webkit-details-marker{display:none}
details.plan .pt{font-weight:700;overflow-wrap:anywhere}
details.lv-master>summary .pt{font-size:19px;line-height:1.25}
details.plan .meta{display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.top-line{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lvl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.chev{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);flex:none;margin-right:3px}
details[open]>summary .chev{transform:rotate(225deg)}
.plan-b{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.kv .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.kv p{margin:2px 0 0;overflow-wrap:anywhere}
.blk{border-left:3px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.blk h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0}
.kids{display:flex;flex-direction:column}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:min(92vw,420px);text-align:center}
@media (prefers-reduced-motion:reduce){.mini.alert{animation:none}}
.dz{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:8px 0 14px}
.dg{display:grid;grid-template-columns:82px repeat(7,minmax(0,1fr))}
.dg>div{padding:6px 2px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);min-height:46px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center}
.dg .dh{font-weight:700;font-size:10px;color:var(--muted);background:var(--bg)}
.dg .dl{font-size:11px;padding-left:6px;font-weight:600;position:sticky;left:0;background:var(--surface);z-index:1;justify-content:flex-start;text-align:left}
.dg .dcmd{font-size:10px;line-height:1.2;background:repeating-linear-gradient(45deg,transparent 0 6px,var(--line) 6px 7px);font-size:11px;color:var(--muted);text-align:center}
.pdc{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;margin:1px;font-size:11px;font-weight:700;background:var(--surface);color:var(--ink);border:2px solid var(--accent);flex:none}
.pdc.adv{border-style:dashed}
.pdc.nd{border-color:var(--line);color:var(--muted)}
.pdl{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.efd{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:14px;margin:10px 0}
.efd h3{font-size:13px;margin:0 0 6px;color:var(--accent)}
.srch{position:relative;margin-bottom:10px}
.srch input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 44px 0 14px;background:var(--surface);font:inherit;-webkit-appearance:none;appearance:none}
.srch input::-webkit-search-cancel-button{display:none}
.srch .clr{position:absolute;right:0;top:0;width:46px;height:46px;font-size:24px;line-height:1;color:var(--muted)}
.srch .clr[hidden]{display:none}
.fs{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.fs .fk{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:var(--bg)}
.fs.ok .fk{background:var(--accent);border-color:var(--accent)}
.fs .ft{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fs.ok .ft{opacity:.6}
.pdrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:8px;align-items:center}
.pdrow input[type=text]{grid-column:1/-1}
.pdrow input[type=text],.pdrow input[type=month]{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--bg)}
.sheet textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font:inherit;resize:vertical;min-height:72px}
.sheet input[type=number],.sheet select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg)}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-h b{font-size:17px;text-align:center;flex:1}
.cal-h button{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:10px;font-weight:700;font-size:24px;line-height:1;background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0 0 3px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:14px}
.cal .wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.cal .day{min-height:54px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:5px 0;font-size:14px;font-weight:600}
.cal .day.out{opacity:.45}
.cal .day.today{border:2px solid var(--accent)}
.cal .day.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cal .dots{display:flex;gap:3px;align-items:center;font-size:10px;font-weight:700;line-height:1}
.cal .dp{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:2px 5px;min-width:16px;text-align:center}
.cal .dd{background:var(--warn);color:var(--surface);border-radius:8px;padding:2px 5px;min-width:16px;text-align:center}
.agday{display:flex;flex-direction:column;gap:4px;padding-bottom:84px}
.agday .head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 2px}
.agday h2{font-size:18px}
.agwrap{border-bottom:1px solid var(--line);padding-bottom:6px}
.agwrap .row{border-bottom:0;text-align:left}
</style>
</head>
<body>

<div class="wrap">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<button class="fab" id="fab" data-act="add" aria-label="Nova tarefa">+</button>
<nav class="tabs" id="tabs" aria-label="Seções">
  <button data-act="tab" data-t="hoje"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="10" rx="1.5"/><rect x="16" y="4" width="5" height="13" rx="1.5"/></svg>Quadro</button>
  <button data-act="tab" data-t="agenda"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Agenda</button>
  <button data-act="tab" data-t="matriz"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Matriz</button>
  <button data-act="tab" data-t="foco"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 1.5M9.5 2.8h5"/></svg>Foco</button>
</nav>
<div id="sheetwrap" hidden>
  <div class="scrim" data-act="close"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
var DAYS=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
var COLS=[{k:'backlog',n:'A fazer'},{k:'today',n:'Hoje'},{k:'doing',n:'Fazendo'},{k:'waiting',n:'Aguardando'},{k:'done',n:'Feito'}];
var Q={1:{n:'Fazer agora',s:'Urgente e importante'},2:{n:'Agendar',s:'Importante, não urgente'},3:{n:'Delegar',s:'Urgente, não importante'},4:{n:'Eliminar',s:'Nem urgente, nem importante'}};
var DEFAULTS={wip:2,focusMin:25,shortMin:5,longMin:15,cycles:4};
var DEFAULT_AREAS={domestica:'Doméstica',profissional:'Profissional',lazer:'Lazer',estudos:'Estudos'};
var AREA_SLOT={domestica:1,profissional:2,lazer:3,estudos:4,controladoria:5};
var CIRC=2*Math.PI*100;
var db=null;
var S={tasks:[],windows:[],sessions:[],projects:[],someday:[],kickoff:[],plans:[],openPlan:{},kickOpen:null,openProj:{},confirmId:null,settings:Object.assign({},DEFAULTS),areaNames:{},timer:null,ready:false,err:null,tab:'hoje',sheet:null,boardInit:false,handled:null,seenRunning:null};
var busy=false;

function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function startOfToday(){var d=new Date();d.setHours(0,0,0,0);return d.getTime();}
function pad(n){return String(n).padStart(2,'0');}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function toMin(s){var p=String(s||'0:0').split(':');return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0);}
function fmtMin(m){m=Math.round(+m||0);if(!m)return '—';if(m<60)return m+' min';var h=Math.floor(m/60),r=m%60;return h+'h'+(r?pad(r):'');}
function clock(ms){var s=Math.max(0,Math.ceil(ms/1000));return pad(Math.floor(s/60))+':'+pad(s%60);}
function areaName(k){if(!k)return 'Sem área';return S.areaNames[k]||DEFAULT_AREAS[k]||(String(k).charAt(0).toUpperCase()+String(k).slice(1).replace(/[-_]/g,' '));}
function areaSlot(k){if(AREA_SLOT[k])return AREA_SLOT[k];var h=0,i,s=String(k||'');for(i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%997;return 5+(h%2);}
function areaChip(k){return '<span class="area" style="--ac:var(--a'+areaSlot(k)+')"><i></i>'+esc(areaName(k))+'</span>';}
function winChip(w){
  if(w.areas&&w.areas.length)return '<span class="area" style="--ac:var(--a6)"><i></i>'+esc(w.label||'Livre')+'</span><span class="sub">'+esc(w.areas.map(areaName).join(', '))+'</span>';
  return areaChip(w.area);
}
function quad(t){var u=!!t.urgent,i=!!t.important;return u&&i?1:(!u&&i?2:(u&&!i?3:4));}
function sortTasks(a,b){return quad(a)-quad(b)||String(a.dueDate||'9999').localeCompare(String(b.dueDate||'9999'))||(a.createdAt||0)-(b.createdAt||0);}
function effStatus(t){return (t.status==='backlog'&&t.plannedDate&&t.plannedDate<=todayStr())?'today':t.status;}
function colOf(t){if(t.status==='done')return (t.doneAt&&t.doneAt>=startOfToday())?'done':null;var s=effStatus(t);return ['backlog','today','doing','waiting'].indexOf(s)>=0?s:'backlog';}
function doneCount(id){var n=0;S.sessions.forEach(function(s){if(s.taskId===id)n++;});return n;}
function winOf(t){return t.windowId?S.windows.find(function(w){return w.id===t.windowId;}):null;}
function dueLabel(t){if(!t.dueDate)return '';var p=String(t.dueDate).split('-');var l=p[2]+'/'+p[1];return t.dueDate<todayStr()?'<span class="late">venceu '+l+'</span>':'<span>até '+l+'</span>';}
function ddmm(s){var p=String(s||'').split('-');return p.length===3?p[2]+'/'+p[1]:'';}
function projOf(t){return t.projectId?S.projects.find(function(p){return p.id===t.projectId;}):null;}
function projTag(t){var p=projOf(t);return p?'<span>↳ '+esc(p.title)+'</span>':'';}
function waitMeta(t){
  if(t.status!=='waiting')return '';
  var days=t.waitingSince?Math.max(0,Math.floor((Date.now()-t.waitingSince)/86400000)):0,td=todayStr();
  var f=t.followUpDate?(t.followUpDate<td?'<span class="late">cobrança atrasada '+ddmm(t.followUpDate)+'</span>':(t.followUpDate===td?'<span class="late">cobrar hoje</span>':'<span>cobrar '+ddmm(t.followUpDate)+'</span>')):'';
  return '<span>com '+esc(t.waitingFor||'?')+'</span><span class="mono">'+(days?'há '+days+' d':'desde hoje')+'</span>'+f;
}
function followHdr(){
  var n=S.tasks.filter(function(t){return t.status==='waiting'&&t.followUpDate&&t.followUpDate<=todayStr();}).length;
  return n?' · <span class="late">'+n+' cobrança'+(n===1?'':'s')+'</span>':'';
}
function waitBlock(t){
  if(t.status==='done')return '';
  var id=esc(t.id);
  if(t.status==='waiting'){
    return '<div><h4>Aguardando</h4><p class="sub">Com <b>'+esc(t.waitingFor||'?')+'</b>'+(t.waitingSince?' desde '+esc(new Date(t.waitingSince).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})):'')+'</p>'
      +'<label class="l" for="f-follow" style="margin-top:8px">Data da cobrança</label><input id="f-follow" type="date" value="'+esc(t.followUpDate||'')+'">'
      +'<div class="seg" style="margin-top:8px"><button data-act="waitsave" data-id="'+id+'">Salvar data</button><button data-act="waitback" data-id="'+id+'">Voltou para Hoje</button></div></div>';
  }
  return '<div><h4>Delegar ou aguardar alguém</h4><label class="l" for="f-who">Com quem está</label><input id="f-who" type="text" maxlength="60" autocomplete="off">'
    +'<label class="l" for="f-follow" style="margin-top:8px">Quando cobrar</label><input id="f-follow" type="date" min="'+todayStr()+'">'
    +'<button class="btn full" style="margin-top:10px" data-act="waitset" data-id="'+id+'">Passar para Aguardando</button></div>';
}
function fmtDate(s){var p=String(s||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:String(s||'');}
function byOrder(a,b){return (a.order||0)-(b.order||0)||(a.createdAt||0)-(b.createdAt||0);}
function planById(id){return id?S.plans.find(function(p){return p.id===id;})||null:null;}
function childrenOf(id){return S.plans.filter(function(p){return (p.parentId||null)===(id||null);}).sort(byOrder);}
function tasksOfPlan(id){
  var pids=S.projects.filter(function(p){return p.goalId===id;}).map(function(p){return p.id;});
  return S.tasks.filter(function(t){return t.goalId===id||pids.indexOf(t.projectId)>=0;});
}
function planProgress(id,seen){
  seen=seen||{};if(seen[id])return {done:0,total:0};seen[id]=1;
  var ts=tasksOfPlan(id),d=ts.filter(function(t){return t.status==='done';}).length,n=ts.length;
  childrenOf(id).forEach(function(c){var r=planProgress(c.id,seen);d+=r.done;n+=r.total;});
  return {done:d,total:n};
}
function goalOfTask(t){
  var p=t.goalId?planById(t.goalId):null;
  if(!p&&t.projectId){var pr=S.projects.find(function(x){return x.id===t.projectId;});if(pr&&pr.goalId)p=planById(pr.goalId);}
  return p;
}
function nextOfProject(pid){
  var o=S.tasks.filter(function(t){return t.projectId===pid&&t.status!=='done';}).sort(function(a,b){return (b.isNext?1:0)-(a.isNext?1:0)||(a.createdAt||0)-(b.createdAt||0);});
  return o[0]||null;
}
function phaseName(p){return p==='focus'?'Foco':(p==='short'?'Pausa':'Pausa longa');}
function toast(msg){var el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){el.hidden=true;},3800);}

/* ---------- timer derivation ---------- */
function timerView(){
  var T=S.timer;
  if(!T||!T.phase||T.phase==='idle')return {mode:'idle'};
  var st=S.settings;
  var total=(T.phase==='focus'?st.focusMin:(T.phase==='short'?st.shortMin:st.longMin))*60000;
  if(T.running){var rem=(T.endsAt||0)-Date.now();return {mode:rem<=0?'expired':'running',rem:Math.max(0,rem),total:total,T:T};}
  return {mode:'paused',rem:(T.remainingMs!=null?T.remainingMs:total),total:total,T:T};
}

/* ---------- views ---------- */
function panel(title,text){return '<div class="panel"><h2>'+esc(title)+'</h2><p>'+text+'</p></div>';}
function guard(){
  if(db===undefined||(!S.ready&&!S.err&&db!==null))return panel('Carregando','Buscando suas tarefas.');
  if(db===null&&S.dbChecked)return panel('Banco de dados indisponível','Esta página não conseguiu abrir o banco de dados neste aparelho. Abra o link entrando no Claude com a sua conta.');
  if(S.err)return panel('Não foi possível carregar',esc(S.err));
  if(!S.ready)return panel('Carregando','Buscando suas tarefas.');
  return null;
}

function card(t){
  var q=quad(t),done=doneCount(t.id),st=S.settings;
  var planned=Math.max(1,Math.ceil((+t.estMin||st.focusMin)/st.focusMin));
  var total=Math.min(Math.max(planned,done),10),dots='',i;
  for(i=0;i<total;i++)dots+='<b class="'+(i<done?'on':'')+'"></b>';
  var w=winOf(t);
  return '<button class="card" data-act="open" data-id="'+esc(t.id)+'">'
    +'<span class="card-top">'+areaChip(t.area)+'<span class="q q'+q+'" title="'+esc(Q[q].n)+'">Q'+q+'</span></span>'
    +'<span class="card-title">'+esc(t.title)+'</span>'
    +'<span class="card-meta"><span class="mono">'+fmtMin(t.estMin)+'</span>'
    +'<span class="dots" role="img" aria-label="'+done+' de '+planned+' pomodoros">'+dots+'</span>'
    +(w?'<span class="mono">'+esc(w.start)+'–'+esc(w.end)+'</span>':'')
    +projTag(t)+waitMeta(t)+dueLabel(t)+'</span></button>';
}

function addDaysStr(n){var d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
var WIN_DAYS=7;
function inWin(t){return !t.plannedDate||t.plannedDate<=addDaysStr(WIN_DAYS);}
function showIn(t,k){return colOf(t)===k&&matchQ(t)&&(k!=='backlog'||!!S.q||inWin(t));}
function laterList(){return S.tasks.filter(function(t){return colOf(t)==='backlog'&&!inWin(t);});}
function dayHead(s){if(!s)return 'Sem dia definido';if(s===addDaysStr(1))return 'Amanhã';var d=new Date(s+'T12:00:00');var w=DAYS[d.getDay()];return w.charAt(0).toUpperCase()+w.slice(1)+' '+s.slice(8)+'/'+s.slice(5,7);}
function cardSm(t,showDate){
  var q=quad(t);
  return '<button class="card sm" data-act="open" data-id="'+esc(t.id)+'"><span class="card-title">'+esc(t.title)+'</span>'
    +'<span class="card-meta">'+areaChip(t.area)+'<span class="q q'+q+'">Q'+q+'</span><span class="mono">'+fmtMin(t.estMin)+'</span>'
    +(showDate&&t.plannedDate?'<span class="mono">'+esc(t.plannedDate.slice(8)+'/'+t.plannedDate.slice(5,7))+'</span>':'')+dueLabel(t)+'</span></button>';
}
function normQ(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
function matchQ(t){var q=normQ(S.q);return !q||normQ(t.title).indexOf(q)>=0;}
function firstSteps(){
  var hasW=S.windows.length>0,hasT=S.tasks.length>0,hasP=S.plans.length>0;
  if(hasW&&hasT)return '';
  function it(done,t,d,act,dt,lbl){return '<div class="fs'+(done?' ok':'')+'"><span class="fk">'+(done?'✓':'')+'</span><span class="ft"><b>'+t+'</b><span class="sub">'+d+'</span></span>'+(done?'':'<button class="btn small" data-act="'+act+'"'+(dt?' data-t="'+dt+'"':'')+'>'+lbl+'</button>')+'</div>';}
  return '<div class="panel" style="margin-bottom:12px"><h2>Primeiros passos</h2><p>Três passos rápidos, no seu ritmo. Você pode mudar tudo depois.</p>'
    +it(hasW,'Seus horários','Cadastre os blocos de tempo da sua semana e a área de cada um.','tab','ajustes','Cadastrar')
    +it(hasT,'Sua primeira tarefa','Escreva algo que precisa fazer. O botão + está no canto da tela.','add',null,'Nova tarefa')
    +it(hasP,'Sua visão (opcional)','Pense onde quer estar em alguns anos e transforme em metas. Vale revisitar de vez em quando.','tab','metas','Escrever')+'</div>';
}
function renderHoje(){
  var g=guard();if(g)return g;
  if(!S.tasks.length){
    return firstSteps()||panel('Quadro vazio','Lance uma tarefa com o botão +.');
  }
  var q=S.q||'';
  return firstSteps()+'<div class="srch"><input id="q" type="search" enterkeyhint="search" placeholder="Buscar tarefa pelo título" aria-label="Buscar tarefa pelo título" autocomplete="off" value="'+esc(q)+'"><button class="clr" data-act="qclear" aria-label="Limpar busca"'+(q?'':' hidden')+'>×</button></div><div id="bw">'+boardHtml()+'</div>';
}
function colBody(x){
  var k=x.c.k,out='',last='';
  if(!x.list.length)out='<p class="none">Nada aqui.</p>';
  else if(k==='backlog'){
    x.list.forEach(function(t){
      if(!S.q&&(t.plannedDate||'')!==last){last=t.plannedDate||'';out+='<p class="dayh">'+esc(dayHead(t.plannedDate))+'</p>';}
      out+=cardSm(t,!!S.q);
    });
  }else if(k==='done')out=x.list.map(function(t){return cardSm(t,false);}).join('');
  else out=x.list.map(card).join('');
  if(k==='backlog'&&!S.q){var n=laterList().length;if(n)out+='<button class="later" data-act="tab" data-t="adiante">+ '+n+' mais adiante ›</button>';}
  return out;
}
function boardHtml(){
  var st=S.settings;
  var cols=COLS.map(function(c){
    var list=S.tasks.filter(function(t){return showIn(t,c.k);});
    if(c.k==='done')list.sort(function(a,b){return (b.doneAt||0)-(a.doneAt||0);});else if(c.k==='backlog')list.sort(function(a,b){return String(a.plannedDate||'9999').localeCompare(String(b.plannedDate||'9999'))||sortTasks(a,b);});else list.sort(sortTasks);
    return {c:c,list:list};
  });
  var pills='<div class="pills" role="tablist">'+cols.map(function(x,i){
    return '<button class="pill" data-act="col" data-i="'+i+'">'+x.c.n+'<span class="n">'+x.list.length+(x.c.k==='doing'?'/'+st.wip:'')+'</span></button>';
  }).join('')+'</div>';
  var board='<div class="board">'+cols.map(function(x){
    var full=x.c.k==='doing'&&x.list.length>=st.wip;
    return '<section class="col" aria-label="'+x.c.n+'"><div class="col-h"><h3>'+x.c.n+(x.c.k==='backlog'&&!S.q?' <small>próx. '+WIN_DAYS+' dias</small>':'')+'</h3><span class="count'+(full?' full':'')+'">'+x.list.length+(x.c.k==='doing'?' / '+st.wip:'')+'</span></div>'
      +colBody(x)+'</section>';
  }).join('')+'</div>';
  return pills+board;
}

function renderMais(){
  var np=S.projects.filter(function(p){return p.status!=='done';}).length;
  var nw=S.windows.length;
  var arrow='<span class="mono" aria-hidden="true">›</span>';
  return '<p class="sect">Configuração e visão geral</p>'
   +'<button class="mrow" data-act="tab" data-t="janelas"><span><b>Janelas</b><span class="d">Seus horários por área ('+nw+')</span></span>'+arrow+'</button>'
   +'<button class="mrow" data-act="tab" data-t="adiante"><span><b>Mais adiante</b><span class="d">Tarefas além dos próximos '+WIN_DAYS+' dias ('+laterList().length+')</span></span>'+arrow+'</button>'
   +'<button class="mrow" data-act="tab" data-t="listas"><span><b>Listas</b><span class="d">Projetos ('+np+'), algum dia/talvez e referência</span></span>'+arrow+'</button>'
   +(S.plans.some(function(x){return x.tipo==='linha_esforco';})?'<button class="mrow" data-act="tab" data-t="desenho"><span><b>Desenho do plano</b><span class="d">Mapa do plano mestre: linhas, pontos decisivos e estado final</span></span>'+arrow+'</button>':'')
   +'<button class="mrow" data-act="tab" data-t="ajustes"><span><b>Ajustes</b><span class="d">Pomodoro, limite de Fazendo, áreas e janelas de horário</span></span>'+arrow+'</button>'
   +'<button class="mrow" data-act="tab" data-t="metas"><span><b>Metas</b><span class="d">Planejamento de vida e metas</span></span>'+arrow+'</button>';
}

function renderAdiante(){
  var g=guard();if(g)return g;
  var list=laterList().sort(function(a,b){return String(a.plannedDate||'9999').localeCompare(String(b.plannedDate||'9999'))||sortTasks(a,b);});
  if(!list.length)return '<p class="none">Nada além dos próximos '+WIN_DAYS+' dias.</p>';
  var out='<p class="sub">Toque numa tarefa para mudar o dia planejado.</p>',last='#';
  list.forEach(function(t){
    var key=t.plannedDate?t.plannedDate.slice(0,7):'';

function syncPills(){
  var b=$('.board');if(!b)return;var cols=b.querySelectorAll('.col'),best=0,bd=1e9,i;
  for(i=0;i<cols.length;i++){var d=Math.abs(cols[i].offsetLeft-b.scrollLeft);if(d<bd){bd=d;best=i;}}
  Array.prototype.forEach.call(document.querySelectorAll('.pill'),function(p,j){p.classList.toggle('on',j===best);});
}

/* ---------- writes ---------- */
async function write(fn){
  if(!db){toast('Banco de dados indisponível neste aparelho.');return false;}
  if(busy)return false;
  busy=true;
  try{await fn();return true;}
  catch(e){toast('Não foi possível salvar'+(e&&e.message?': '+e.message:'.'));return false;}
  finally{busy=false;}
}
function wipFull(excludeId){
  var n=S.tasks.filter(function(x){return x.status==='doing'&&x.id!==excludeId;}).length;
  return n>=S.settings.wip;
}
async function moveTask(id,to){
  var t=S.tasks.find(function(x){return x.id===id;});if(!t||effStatus(t)===to)return;
  if(to==='doing'&&wipFull(id)){toast('Limite de '+S.settings.wip+' em Fazendo. Conclua ou devolva uma tarefa antes.');return;}
  var patch={status:to,doneAt:to==='done'?Date.now():null};
  if(to==='backlog'&&t.plannedDate&&t.plannedDate<=todayStr()){patch.plannedDate=null;toast('Dia planejado removido: a tarefa voltou para A fazer.');}
  if(t.status==='waiting'){patch.waitingFor=null;patch.waitingSince=null;patch.followUpDate=null;}
  var ok=await write(function(){return db.doc('tasks/'+id).update(patch);});
  if(ok)closeSheet();
}
async function waitSet(id){
  var who=((($('#f-who')||{}).value)||'').trim(),fu=($('#f-follow')||{}).value||'';
  if(!who){toast('Diga com quem a tarefa está.');return;}
  if(!fu){toast('Escolha quando cobrar.');return;}
  var ok=await write(function(){return db.doc('tasks/'+id).update({status:'waiting',waitingFor:who,waitingSince:Date.now(),followUpDate:fu,doneAt:null});});
  if(ok){closeSheet();toast('Passou para Aguardando.');}
}
async function waitSave(id){
  var fu=($('#f-follow')||{}).value||'';
  if(!fu){toast('Escolha a data da cobrança.');return;}
  var ok=await write(function(){return db.doc('tasks/'+id).update({followUpDate:fu});});
  if(ok)toast('Data de cobrança salva.');
}
async function waitBack(id){
  var ok=await write(function(){return db.doc('tasks/'+id).update({status:'today',waitingFor:null,waitingSince:null,followUpDate:null});});
  if(ok){closeSheet();toast('Voltou para Hoje.');}
}
async function startFocus(id){
  var ok=await write(async function(){
    var t=S.tasks.find(function(x){return x.id===id;});if(!t)return;
    if(t.status!=='doing'){
      if(wipFull(id)){toast('Limite de '+S.settings.wip+' em Fazendo. Conclua ou devolva uma tarefa antes.');throw new Error('wip');}
      await db.doc('tasks/'+id).update({status:'doing',doneAt:null,waitingFor:null,waitingSince:null,followUpDate:null});
    }
    var cyc=(S.timer&&S.timer.cycle)||0;
    await db.doc('state/timer').set({taskId:id,phase:'focus',running:true,endsAt:Date.now()+S.settings.focusMin*60000,remainingMs:null,cycle:cyc});
  });
  if(ok){closeSheet();unlockAudio();wakeLock();S.tab='foco';render();}
}
async function timerPatch(patch){await write(function(){return db.doc('state/timer').update(patch);});}
async function setIdle(){
  await write(function(){return db.doc('state/timer').set({taskId:null,phase:'idle',running:false,endsAt:null,remainingMs:null,cycle:(S.timer&&S.timer.cycle)||0});});
}
async function finishFocus(finished){
  await write(async function(){
    var T=S.timer,t=S.tasks.find(function(x){return x.id===T.taskId;});
    await db.collection('sessions').add({taskId:T.taskId,area:t?t.area:null,at:Date.now(),minutes:S.settings.focusMin,finishedTask:!!finished});
    if(finished&&t)await db.doc('tasks/'+t.id).update({status:'done',doneAt:Date.now()});
    var cyc=(T.cycle||0)+1,long=cyc%S.settings.cycles===0,mins=long?S.settings.longMin:S.settings.shortMin;
    await db.doc('state/timer').set({taskId:finished?null:T.taskId,phase:long?'long':'short',running:true,endsAt:Date.now()+mins*60000,remainingMs:null,cycle:cyc});
  });
}

/* ---------- alerts ---------- */
var actx=null,wl=null;
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
function beep(){
  try{unlockAudio();var o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=0.15;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+0.4);}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
}
async function wakeLock(){try{if(navigator.wakeLock&&document.visibilityState==='visible')wl=await navigator.wakeLock.request('screen');}catch(e){}}
document.addEventListener('visibilitychange',function(){var v=timerView();if(document.visibilityState==='visible'&&(v.mode==='running'))wakeLock();});

function tick(){
  var v=timerView(),mini=$('#mini');
  if(mini){
    if(v.mode==='idle'){mini.hidden=true;}
    else{mini.hidden=false;mini.textContent=phaseName(v.T.phase)+' '+(v.mode==='expired'?'00:00':clock(v.rem));mini.className='mini '+v.T.phase+(v.mode==='expired'?' alert':'');}
  }
  var c=$('#clock');
  if(c&&(v.mode==='running'||v.mode==='paused')){
    c.textContent=clock(v.rem);var r=$('#ringp');if(r)r.style.strokeDashoffset=String(CIRC*(1-v.rem/v.total));
  }
  if(v.mode==='running')S.seenRunning=v.T.endsAt;
  if(v.mode==='expired'&&S.handled!==v.T.endsAt){
    S.handled=v.T.endsAt;
    var alertNow=(S.seenRunning===v.T.endsAt);
    render();
    if(alertNow)beep();
  }
}
setInterval(tick,500);

  if(e.target.id==='sdform'){e.preventDefault();
    var dt=($('#d-t').value||'').trim();if(!dt){toast('Escreva o título.');return;}
    var dp={title:dt,note:($('#d-n').value||'').trim(),area:$('#d-a').value||null};
    var did=e.target.dataset.id,dk=e.target.dataset.kind;
    write(function(){return did?db.doc('someday/'+did).update(dp):db.collection('someday').add(Object.assign(dp,{kind:dk,createdAt:Date.now()}));}).then(function(ok){if(ok){closeSheet();toast('Salvo.');}});return;}
  if(e.target.id==='winform'){e.preventDefault();
    var wf=e.target,ws=$('#w-s').value,we=$('#w-e').value;
    if(!ws||!we||toMin(we)<=toMin(ws)){toast('O fim precisa ser depois do início.');return;}
    var wd=Array.prototype.map.call(wf.querySelectorAll('input[name=wd]:checked'),function(x){return parseInt(x.value,10);});
    var wa=Array.prototype.map.call(wf.querySelectorAll('input[name=wa]:checked'),function(x){return x.value;});
    if(!wd.length){toast('Escolha ao menos um dia.');return;}
    if(!wa.length){toast('Escolha ao menos uma área.');return;}
    var wl=($('#w-l').value||'').trim();
    var wp={start:ws,end:we,days:wd,area:wa.length===1?wa[0]:null,areas:wa.length>1?wa:null,label:wa.length>1?(wl||null):null};
    var wid2=wf.dataset.id;
    write(function(){return wid2?db.doc('windows/'+wid2).update(wp):db.collection('windows').add(wp);}).then(function(ok){if(ok){closeSheet();toast('Janela salva.');}});return;}
  if(e.target.id!=='addform')return;
  e.preventDefault();
  var f=e.target.elements,title=f.title.value.trim();
  if(!title){toast('Escreva o título da tarefa.');return;}
  var est=Math.max(5,parseInt(f.est.value,10)||25);
  var from=S.sheet&&S.sheet.extra&&S.sheet.extra.from;
  write(function(){return db.collection('tasks').add({title:title,area:f.area.value,estMin:est,urgent:f.urgent.checked,important:f.important.checked,status:'backlog',windowId:null,plannedDate:null,dueDate:null,complexity:null,notes:'',source:'manual',projectId:(S.sheet&&S.sheet.extra&&S.sheet.extra.projectId)||null,createdAt:Date.now(),doneAt:null});})
    .then(function(ok){if(ok){if(from&&db)db.doc('someday/'+from).delete().catch(function(){});closeSheet();toast('Tarefa adicionada em A fazer.');}});
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.sheet)closeSheet();});
document.addEventListener('change',function(e){
  if(e.target.id!=='bkfile')return;var f=e.target.files&&e.target.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){try{if(!window.confirm('Isto substitui todos os dados deste aparelho pelos do backup. Continuar?')){e.target.value='';return;}db.importJson(String(r.result));toast('Backup restaurado.');}catch(err){toast(err&&err.message?err.message:'Arquivo inválido.');}e.target.value='';};r.readAsText(f);
});
document.addEventListener('input',function(e){
  if(e.target.id!=='q')return;
  S.q=e.target.value;
  var bw=$('#bw');if(!bw)return;
  bw.innerHTML=boardHtml();
  var c=$('.clr');if(c)c.hidden=!S.q;
  var nb=bw.querySelector('.board');
  if(nb){nb.addEventListener('scroll',syncPills,{passive:true});scrollToCol(firstCol(),false);syncPills();}
});
document.addEventListener('click',function(e){
  var s=e.target.closest('summary');if(!s)return;var d=s.parentNode;
  setTimeout(function(){if(d.id==='kick')S.kickOpen=d.open;else if(d.dataset&&d.dataset.pid)S.openProj[d.dataset.pid]=d.open;else if(d.dataset&&d.dataset.plid)S.openPlan[d.dataset.plid]=d.open;},0);
});

/* ---------- data ---------- */
function onData(){render();if(S.sheet&&S.sheet.kind==='task')renderSheet();}
function onErr(e){S.err=(e&&e.message)||'Falha ao ler os dados.';S.ready=true;onData();}
function docs(snap){return snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});}

/* ---------- local database (used when the page runs outside Claude) ---------- */
function localDB(){
  var KEY='quadro-do-dia:v1',st={c:{}},warned=false,ls=[];
  function load(){try{var r=localStorage.getItem(KEY);st=r?JSON.parse(r):{c:{}};if(!st||!st.c)st={c:{}};}catch(e){st={c:{}};}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){if(!warned){warned=true;toast('Este navegador não deixou gravar os dados. Saia do modo privado ou libere o armazenamento.');}}}
  function clone(o){return JSON.parse(JSON.stringify(o));}
  function coll(n){if(!st.c[n])st.c[n]={};return st.c[n];}
  function snapColl(n,w){
    var m=coll(n),ds=Object.keys(m).filter(function(id){return !w||(m[id][w.f]>=w.v);}).map(function(id){return {id:id,exists:true,data:function(){return clone(m[id]);}};});
    return {docs:ds,empty:!ds.length,size:ds.length,forEach:function(f){ds.forEach(f);}};
  }
  function snapDoc(path){var a=path.split('/'),o=coll(a[0])[a[1]];return {exists:!!o,id:a[1],data:function(){return o?clone(o):{};}};}
  function notify(){ls.forEach(function(l){var s=l.path?snapDoc(l.path):snapColl(l.name,l.w);setTimeout(function(){l.cb(s);},0);});}
  function newId(){return 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
  function collRef(n,w){return {
    onSnapshot:function(cb){var l={name:n,w:w,cb:cb};ls.push(l);setTimeout(function(){cb(snapColl(n,w));},0);return function(){ls=ls.filter(function(x){return x!==l;});};},
    where:function(f,op,v){return collRef(n,{f:f,v:v});},
    add:async function(o){var id=newId();coll(n)[id]=clone(o);save();notify();return {id:id};}
  };}
  function docRef(path){var a=path.split('/');return {
    onSnapshot:function(cb){var l={path:path,cb:cb};ls.push(l);setTimeout(function(){cb(snapDoc(path));},0);return function(){ls=ls.filter(function(x){return x!==l;});};},
    set:async function(o){coll(a[0])[a[1]]=clone(o);save();notify();},
    update:async function(o){var m=coll(a[0]);m[a[1]]=Object.assign(m[a[1]]||{},clone(o));save();notify();},
    delete:async function(){delete coll(a[0])[a[1]];save();notify();}
  };}
  load();
  window.addEventListener('storage',function(e){if(e.key===KEY){load();notify();}});
  return {__local:true,collection:collRef,doc:docRef,
    exportJson:function(){return JSON.stringify({app:'quadro-do-dia',version:1,exportedAt:new Date().toISOString(),c:st.c});},
    importJson:function(txt){var o=JSON.parse(txt);if(!o||o.app!=='quadro-do-dia'||!o.c)throw new Error('Arquivo não reconhecido.');st={c:o.c};save();notify();}};
}
async function init(){
  render();
  try{db=(window.claude&&window.claude.use)?await window.claude.use('db'):localDB();}catch(e){db=null;}
  S.dbChecked=true;
  if(!db){render();return;}
  db.collection('tasks').onSnapshot(function(s){S.tasks=docs(s);S.ready=true;onData();},onErr);
  db.collection('windows').onSnapshot(function(s){S.windows=docs(s);onData();},onErr);
  db.collection('sessions').where('at','>=',Date.now()-30*86400000).onSnapshot(function(s){S.sessions=docs(s);onData();},onErr);
  db.doc('config/settings').onSnapshot(function(s){S.settings=Object.assign({},DEFAULTS,s.exists?s.data():{});onData();},onErr);
  db.doc('config/areas').onSnapshot(function(s){S.areaNames=(s.exists&&s.data().names)||{};onData();},onErr);
  db.doc('state/timer').onSnapshot(function(s){S.timer=s.exists?s.data():null;onData();},onErr);
  db.collection('projects').onSnapshot(function(s){S.projects=docs(s);onData();},onErr);
  db.collection('someday').onSnapshot(function(s){S.someday=docs(s);onData();},onErr);
  db.collection('plans').onSnapshot(function(s){S.plans=docs(s);onData();},onErr);
}
init();
})();
</script>
